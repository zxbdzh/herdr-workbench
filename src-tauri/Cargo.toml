[package]
name = "herdr-workbench-desktop"
version = "0.1.4"
description = "Windows-first Herdr Workbench desktop host"
authors = ["zxb"]
edition = "2024"
rust-version = "1.88"
license = "Apache-2.0"
repository = "https://github.com/zxbdzh/herdr-workbench"

[lib]
name = "herdr_workbench_desktop_lib"
crate-type = ["lib", "cdylib", "staticlib"]

[build-dependencies]
tauri-build = { version = "2.6.3", features = [] }

[dependencies]
async-trait = "0.1"
chrono = { version = "0.4", features = ["serde"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
url = "2"
uuid = { version = "1", features = ["v7", "serde"] }

[dev-dependencies]
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }

[dependencies.herdr-workbench-app-core]
path = "../crates/app-core"

[dependencies.herdr-workbench-domain]
path = "../crates/domain"

[dependencies.herdr-workbench-server]
path = "../crates/server"

[dependencies.herdr-workbench-transport]
path = "../crates/transport"

[dependencies.tauri]
version = "2.11.5"
features = []

[target.'cfg(windows)'.dependencies]
webview2-com = "0.38"
windows = { version = "0.61", features = ["Win32_Foundation", "Win32_System_Com", "Win32_UI_Shell"] }
