name: 问题报告
about: 报告一个可以复现的问题
title: "fix: "
labels: ["needs-triage"]
body:
  - type: textarea
    id: symptom
    attributes:
      label: 问题现象
      description: 描述实际发生了什么，以及你期望发生什么。
    validations:
      required: true

  - type: textarea
    id: reproduction
    attributes:
      label: 复现步骤
      description: 提供最小、按顺序排列的复现步骤。
      placeholder: |
        1. 
        2. 
        3. 
    validations:
      required: true

  - type: textarea
    id: environment
    attributes:
      label: 环境信息
      description: Windows 版本、Herdr 版本、Workbench 版本、终端、Shell 等。
      placeholder: |
        - Windows:
        - Herdr:
        - Workbench:
        - Terminal:
        - Shell:
    validations:
      required: true

  - type: textarea
    id: logs
    attributes:
      label: 日志与证据
      description: 粘贴相关日志、截图或复现结果。请先删除密钥、Cookie、token、路径中的隐私信息。
      render: text

  - type: textarea
    id: workaround
    attributes:
      label: 临时规避方式
      description: 如果有已知 workaround，请写在这里。

  - type: checkboxes
    id: checks
    attributes:
      label: 提交前确认
      options:
        - label: 我已经搜索过现有 Issue，确认不是重复问题。
          required: true
        - label: 我没有在内容中包含密钥、Cookie、token 或其他敏感信息。
          required: true
